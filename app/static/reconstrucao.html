<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconstrução 31/12/2022 — Fiscal Stock</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="top">
  <div>
    <h1>FISCAL STOCK</h1>
    <div class="sub">Reconstrução histórica — data base <span class="mono">31/12/2022</span></div>
  </div>
  <nav class="tabs">
    <a href="/">Dashboard</a>
    <a class="on" href="/reconstrucao">Reconstrução</a>
    <a href="/importar">Importar</a>
    <a href="#" id="btn-sair" title="Encerrar sessão">Sair</a>
  </nav>
</header>

<main>
  <div id="erro"></div>

  <div class="controls">
    <input type="search" id="q" placeholder="Filtrar por descrição, código do item ou NCM…"
           autocomplete="off">
    <select id="uf">
      <option value="">Todas as filiais</option>
      <option value="SP">SP — 05502390000383</option>
      <option value="CE">CE — 05502390000111</option>
      <option value="SC">SC — 05502390000200</option>
    </select>
    <select id="ordem">
      <option value="valor">Maior valor</option>
      <option value="qtd">Maior quantidade</option>
      <option value="custo">Maior custo unitário</option>
      <option value="codigo">Código do item</option>
    </select>
    <button id="limpar">Limpar</button>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="lbl">Resultado do filtro</div>
    <div class="val sm" id="resumo">…</div>
    <div class="foot" id="resumo2"></div>
  </div>

  <div class="wrap">
    <table id="tbl">
      <thead><tr>
        <th>UF</th><th>Código</th><th class="desc">Descrição</th><th>NCM</th>
        <th>Un.</th><th class="num">Quantidade</th><th class="num">Custo unit.</th>
        <th class="num">Valor total</th><th>Propriedade</th>
      </tr></thead>
      <tbody><tr><td colspan="9" class="skel">carregando…</td></tr></tbody>
    </table>
  </div>

  <div class="controls" style="margin-top:16px; justify-content:center">
    <button id="ant">‹ Anteriores</button>
    <span class="muted" id="pag"></span>
    <button id="prox">Próximos ›</button>
  </div>
</main>

<script src="/app.js"></script>
<script>ligarSair();</script>
<script>
let offset = 0;
const LIM = 60;
const $ = id => document.getElementById(id);

async function carregar() {
  const p = new URLSearchParams({
    q: $('q').value.trim(), uf: $('uf').value, ordem: $('ordem').value,
    limit: LIM, offset
  });
  let rows;
  try { rows = await api('/api/inventario?' + p); } catch (e) { return falha(e); }

  const total = rows.length ? +rows[0].total_geral : 0;
  const somaPg = rows.reduce((s, r) => s + +r.vl_item, 0);
  $('resumo').textContent = `${n(total)} ${total === 1 ? 'item' : 'itens'}`;
  $('resumo2').textContent = rows.length
    ? `Exibindo ${n(offset + 1)}–${n(offset + rows.length)} · soma da página ${money(somaPg)}`
    : 'Nenhum item corresponde ao filtro.';

  fill('tbl', rows, r => `
    <td><span class="chip uf">${r.uf}</span></td>
    <td class="mono">${esc(r.cod_item)}</td>
    <td class="desc">${esc(r.descr_item || '')}</td>
    <td class="mono">${esc(r.ncm || '—')}</td>
    <td>${esc(r.unid || '')}</td>
    <td class="num">${n(r.qtd)}</td>
    <td class="num">${money(r.vl_unit)}</td>
    <td class="num"><b>${money(r.vl_item)}</b></td>
    <td>${r.ind_prop === '1'
        ? `<span class="chip warn" title="${esc(r.depositario || '')}">terceiros</span>`
        : '<span class="chip ok">próprio</span>'}</td>`);

  $('pag').textContent = total ? `página ${Math.floor(offset / LIM) + 1} de ${Math.ceil(total / LIM)}` : '';
  $('ant').disabled = offset === 0;
  $('prox').disabled = offset + LIM >= total;
}

let t;
$('q').addEventListener('input', () => {
  clearTimeout(t); t = setTimeout(() => { offset = 0; carregar(); }, 300);
});
['uf', 'ordem'].forEach(id =>
  $(id).addEventListener('change', () => { offset = 0; carregar(); }));
$('limpar').onclick = () => {
  $('q').value = ''; $('uf').value = ''; $('ordem').value = 'valor'; offset = 0; carregar();
};
$('ant').onclick = () => { offset = Math.max(0, offset - LIM); carregar(); };
$('prox').onclick = () => { offset += LIM; carregar(); };

carregar();
</script>
</body>
</html>
